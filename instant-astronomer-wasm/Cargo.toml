[package]
name = "instant-astronomer-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly (wasm-bindgen) shell for Instant-Astronomer."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
instant-astronomer-core = { path = "../instant-astronomer-core" }
agg-gui = { workspace = true }
demo-wgpu = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Navigator",
    "Geolocation",
    "Position",
    "PositionError",
    "PositionOptions",
    "Coordinates",
    "console",
] }

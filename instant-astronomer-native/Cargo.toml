[package]
name = "instant-astronomer-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Native shell (winit + wgpu) for Instant-Astronomer."

[[bin]]
name = "instant-astronomer-native"
path = "src/main.rs"
test = false

[dependencies]
instant-astronomer-core = { path = "../instant-astronomer-core" }
agg-gui = { workspace = true, features = ["clipboard"] }
# The winit event loop, wgpu surface, and input plumbing all live in the
# published agg-gui-shell crate — this crate is only the app-specific glue.
agg-gui-shell = { workspace = true }
# `time` with `local-offset` so the clock readout shows real DST-correct
# local time on native (no IANA tz lookup; uses OS time zone APIs).
time = { version = "0.3", features = ["local-offset"] }
